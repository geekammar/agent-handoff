name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q lib setup tests

      - name: Check shell scripts
        run: sh -n setup/install.sh setup/upgrade.sh setup/rollback.sh setup/gdrive-auth.sh

      - name: Run unit, integration, and regression tests
        env:
          PYTHONPATH: lib
        run: python -m unittest discover -s tests -p "test_*.py" -v

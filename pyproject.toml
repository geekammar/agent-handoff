[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-handoff"
version = "1.1.0"
description = "AI-native, portable Agent Handoff with optional GitHub dispatch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Agent Handoff maintainers" }]
dependencies = []

[project.scripts]
agent-handoff = "agent_handoff.cli:main"

[tool.setuptools]
package-dir = { "" = "lib" }

[tool.setuptools.packages.find]
where = ["lib"]
include = ["agent_handoff*"]
